name: STM32WB55_CDC_Blinky
mcu: STM32WB55
clock: 64000000
usb:
  type: usb_fs_pma
  base: 0x40006800
  irq: 20
external_devices:
  - type: LED
    bus: GPIOB
    params: {pin: 5, color: blue}
  - type: LED
    bus: GPIOB
    params: {pin: 0, color: green}
  - type: LED
    bus: GPIOB
    params: {pin: 1, color: red}
