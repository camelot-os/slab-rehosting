name: STM32WB55_CDC_Blinky
mcu: STM32WB55
clock: 64000000
usb:
  type: dwc2_otg_fs
  base: 0x50000000
  irq: 67
external_devices:
  - type: LED
    bus: GPIOB
    params: {pin: 5, color: blue}
  - type: LED
    bus: GPIOB
    params: {pin: 0, color: green}
  - type: LED
    bus: GPIOB
    params: {pin: 1, color: red}
