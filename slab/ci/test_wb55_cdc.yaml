# CI Test: STM32WB55 USB CDC Blinky
#
# Tests the WB55 CDC blinky demo with PMA-based USB FS controller.
# This validates the STM32WB peripheral set and USB device initialization.
#
# Board: STM32WB55 with 3 LEDs on GPIOB (pins 0, 1, 5), USB FS PMA
# Firmware: CDC ACM virtual serial port with LED control
scenarios:
  - name: "STM32WB55 CDC Blinky"
    board: slab/boards/stm32wb55_cdc_blinky.yaml
    firmware: slab/examples/cortex-m/stm32/wb55/demos/cdc_blinky/build/WB55_CDC_Blinky.bin
    timeout: 6
    assertions:
      - type: no_crash
      - type: mmio_count
        params: {min: 100}
