# SLAB -- Software Lab for ARM Cortex-M Peripheral Emulation
#
# Author: Mathieu Renard <mathieu.renard@twistedwires.io>
# Copyright (C) 2026 Twisted Wires Security Lab
# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slab-cortex-m"
version = "0.1.0"
description = "Rehost ARM Cortex-M firmware with Python peripheral control"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mathieu Renard", email = "mathieu.renard@twistedwires.io"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Emulators",
]
keywords = ["arm", "cortex-m", "emulator", "embedded", "security", "svd", "qemu"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
crypto = ["cryptography>=41.0"]
gui = ["pygame>=2.5"]
usb = ["pyusb>=1.2.0"]
mcp = ["mcp>=0.1"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=5.0",
    "furo>=2023.1",
]

[project.scripts]
slab-server = "slab_cortex_m.mcuemu_server:main"
slab-mcp = "slab_mcp.server:main"

[project.urls]
Homepage = "https://github.com/twistedwires/slab"
Documentation = "https://slab.readthedocs.io/"
Repository = "https://github.com/twistedwires/slab"
Issues = "https://github.com/twistedwires/slab/issues"

[tool.setuptools.packages.find]
include = ["slab_*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
