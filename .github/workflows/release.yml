name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build slab/python

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: slab/python/dist/

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload slab/python/dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: slab/python/dist/*
          generate_release_notes: true

  deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - container: debian:bookworm
            label: bookworm
          - container: ubuntu:jammy
            label: jammy
    container: ${{ matrix.container }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git python3 python3-all python3-setuptools python3-yaml dh-python debhelper devscripts

      - uses: actions/checkout@v4

      - name: Build .deb package
        run: |
          cd slab/python
          dpkg-buildpackage -us -uc -b

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: slab/*.deb

      - name: Attach .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: slab/*.deb
